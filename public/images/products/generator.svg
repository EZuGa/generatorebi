<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="დიზელ-გენერატორი">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e242c"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39424e"/>
      <stop offset="1" stop-color="#242b34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="2">
    <path d="M-100 600 L700 -200 M0 700 L800 -100 M-200 500 L600 -300"/>
  </g>
  <!-- generator canopy -->
  <g>
    <rect x="130" y="200" width="540" height="240" rx="18" fill="url(#body)" stroke="#4a5560" stroke-width="3"/>
    <rect x="130" y="440" width="540" height="26" rx="8" fill="#10141a"/>
    <!-- vents -->
    <g stroke="#15181d" stroke-width="8">
      <line x1="170" y1="250" x2="170" y2="390"/>
      <line x1="200" y1="250" x2="200" y2="390"/>
      <line x1="230" y1="250" x2="230" y2="390"/>
      <line x1="260" y1="250" x2="260" y2="390"/>
      <line x1="290" y1="250" x2="290" y2="390"/>
    </g>
    <!-- door + panel -->
    <rect x="470" y="235" width="160" height="170" rx="10" fill="#1a2029" stroke="#4a5560" stroke-width="2"/>
    <rect x="490" y="255" width="120" height="60" rx="6" fill="#0f1318"/>
    <circle cx="505" cy="345" r="9" fill="#f59e0b"/>
    <circle cx="535" cy="345" r="9" fill="#3ddc84"/>
    <circle cx="565" cy="345" r="9" fill="#e5484d"/>
    <!-- exhaust -->
    <rect x="600" y="150" width="26" height="60" rx="6" fill="#39424e"/>
    <!-- wheels/base -->
    <rect x="180" y="466" width="440" height="14" rx="6" fill="#0c0f13"/>
  </g>
  <path d="M410 120 L360 210 h34 L370 300 L450 190 h-34 z" fill="#f59e0b" opacity="0.9"/>
  <text x="400" y="540" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#e8ecf1">დიზელ-გენერატორი</text>
</svg>
